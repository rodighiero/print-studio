<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surprise Machines Print Studio</title>
  <link rel="stylesheet" href="assets/print/print.css">
</head>
<body>
  <aside id="panel">
    <h1>Print Studio</h1>
    <p id="status">Loading…</p>

    <form id="controls" autocomplete="off">
      <fieldset>
        <legend>Sheet</legend>
        <label>Size
          <select name="sheet">
            <option value="420x594" selected>A2 portrait (420 × 594 mm)</option>
            <option value="594x420">A2 landscape</option>
            <option value="457.2x609.6">18 × 24 in</option>
            <option value="297x420">A3 portrait</option>
          </select>
        </label>
        <label>Margin (mm) <input type="number" name="margin" value="25" min="0" max="150" step="1"></label>
        <label>Zoom <input type="range" name="zoom" min="0.4" max="2.5" step="0.01" value="1"></label>
        <label>Offset X (mm) <input type="number" name="offsetX" value="0" step="1"></label>
        <label>Offset Y (mm) <input type="number" name="offsetY" value="-40" step="1"></label>
        <label>Caption <input type="text" name="caption" value="Surprise Machines — 213,330 images, Harvard Art Museums"></label>
        <label>Caption size (mm) <input type="number" name="captionSize" value="6" min="1" max="60" step="0.5"></label>
        <label class="inline"><input type="checkbox" name="marks" checked> Registration marks</label>
      </fieldset>

      <fieldset>
        <legend>Layout</legend>
        <select name="layout">
          <option value="umap" selected>UMAP</option>
          <option value="umap-jittered">UMAP (jittered)</option>
          <option value="grid">Grid (Rasterfairy)</option>
          <option value="alphabetic">Alphabetic grid</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Render</legend>
        <select name="render">
          <option value="thumbs">Thumbnails</option>
          <option value="dots" selected>Dots</option>
          <option value="density">Density field</option>
        </select>
        <label data-show="render=thumbs,dots">Mark size (mm) <input type="number" name="size" value="0.8" min="0.05" max="20" step="0.05"></label>
        <label data-show="render=dots,density">Colour by
          <select name="colorBy">
            <option value="image" selected>Image colour</option>
            <option value="tone">Image tone (grey)</option>
            <option value="cluster">Cluster</option>
            <option value="solid">Solid black</option>
          </select>
        </label>
        <label data-show="render=dots">Dot area
          <select name="sizeBy">
            <option value="constant" selected>Constant</option>
            <option value="darkness">By image darkness</option>
          </select>
        </label>
        <label data-show="render=density">Blur (mm) <input type="number" name="blur" value="2" min="0" max="40" step="0.5"></label>
        <label data-show="render=density">Gamma <input type="range" name="gamma" min="0.15" max="3" step="0.05" value="0.6"></label>
        <label data-show="render=density">Bands (0 = continuous) <input type="number" name="bands" value="0" min="0" max="16" step="1"></label>
      </fieldset>

      <fieldset>
        <legend>Inks</legend>
        <select name="inkMode">
          <option value="mono" selected>One colour</option>
          <option value="spot">Spot colours</option>
          <option value="cmyk">CMYK process</option>
        </select>
        <label data-show="inkMode=mono">Ink <input type="color" name="monoInk" value="#1a1a1a"></label>
        <label data-show="inkMode=spot">Number of inks <input type="number" name="inkCount" value="3" min="1" max="4" step="1"></label>
        <div class="swatches" data-show="inkMode=spot">
          <input type="color" name="spot1" value="#e4572e">
          <input type="color" name="spot2" value="#1b4f9c">
          <input type="color" name="spot3" value="#f2a541">
          <input type="color" name="spot4" value="#1a1a1a">
        </div>
        <label>Paper <input type="color" name="paper" value="#f4f0e6"></label>
        <label data-show="inkMode=spot">Separation
          <select name="spotMethod">
            <option value="flat" selected>Flat (nearest ink)</option>
            <option value="dither">Dithered</option>
          </select>
        </label>
        <label data-show="inkMode=mono,cmyk">Screen
          <select name="screen">
            <option value="am" selected>Halftone dots</option>
            <option value="lines">Line screen</option>
            <option value="fs">Stochastic (error diffusion)</option>
            <option value="threshold">Threshold</option>
          </select>
        </label>
        <label data-show="inkMode=mono,cmyk;screen=am,lines">LPI <input type="number" name="lpi" value="35" min="5" max="85" step="1"></label>
        <label data-show="inkMode=mono;screen=am,lines">Angle (°) <input type="number" name="angle" value="22.5" step="0.5"></label>
        <label data-show="inkMode=cmyk">Black generation <input type="range" name="gcr" min="0" max="1" step="0.05" value="1"></label>
      </fieldset>

      <fieldset>
        <legend>Output</legend>
        <label>Preview <select id="view"><option value="composite">Composite</option></select></label>
        <label>Export dpi
          <select name="dpi">
            <option value="300" selected>300</option>
            <option value="400">400</option>
          </select>
        </label>
        <button type="button" id="export">Export films (PNG)</button>
      </fieldset>
    </form>
    <p class="hint">Preview shows continuous tone. Click the sheet to see a detail at export dpi with the real screen.</p>
  </aside>

  <main>
    <div id="sheet"><canvas id="preview"></canvas></div>
    <figure id="loupe" hidden>
      <canvas width="600" height="600"></canvas>
      <figcaption></figcaption>
    </figure>
  </main>

  <script type="module" src="assets/print/app.js"></script>
</body>
</html>
