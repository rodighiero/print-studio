<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print Studio</title>
  <meta name="description" content="A print studio that turns data visualizations into screen-printing films. Current project: Surprise Machines, 213,330 Harvard Art Museums images.">
  <link rel="stylesheet" href="assets/print.css">
</head>
<body>
  <form id="controls" class="studio" autocomplete="off">
    <!-- The sheet fills the window between the two floating panel columns. -->
    <main id="sheet" aria-label="Print sheet" aria-busy="true">
      <!-- The film bleed around the sheet, with its registration marks, when Bleed is on. -->
      <canvas id="bleed" hidden aria-hidden="true"></canvas>
      <canvas id="preview" tabindex="0" role="img" aria-label="Print sheet. Drag to move the map. Use plus and minus to zoom. Press I to inspect, move the square to explore, and click or press Enter to select an area. Press Escape to return to dragging."></canvas>
      <div id="inspection-area" hidden aria-hidden="true"></div>
      <!-- Fine guide: thin lines every 50 mm from the sheet centre. Below the thirds grid. Never printed. -->
      <svg id="sheet-grid-fine" preserveAspectRatio="none" hidden aria-hidden="true"><path/></svg>
      <!-- Composition guide on the sheet: centre cross and thirds. Never printed. -->
      <svg id="sheet-grid" viewBox="0 0 100 100" preserveAspectRatio="none" hidden aria-hidden="true">
        <path class="thirds" d="M33.333 0V100M66.667 0V100M0 33.333H100M0 66.667H100"/>
        <path class="centre" d="M50 0V100M0 50H100"/>
      </svg>
    </main>

    <!-- Two columns at the window sides leave the full height to the sheet. -->
    <div class="column" id="column-left">
      <p class="credit panel">
        <a class="title" href="./">Print Studio</a>
        <a class="external" href="https://github.com/rodighiero/print-studio" target="_blank" rel="noopener">GitHub</a>
      </p>
      <!-- The visualization being printed. More projects will join this menu. -->
      <aside id="panel-project" class="card panel" aria-label="Project">
        <fieldset class="panel-settings" disabled>
          <fieldset class="group"><legend>Project</legend>
            <select name="project" aria-label="Project">
              <option value="surprise-machines">Surprise Machines</option>
            </select>
            <a class="external" href="https://github.com/rodighiero/surprise-machines" target="_blank" rel="noopener">Source</a>
          </fieldset>
          <fieldset class="group"><legend>Dot size</legend>
            <div class="size-row" data-size="1">
              <div class="field">
                <span class="size-choice"><input type="checkbox" checked disabled aria-label="Size 1 is always exported"><label class="radio-option"><input type="radio" name="sizePreview" value="1" checked><span>Size 1</span></label></span>
                <output id="mark-size-1-level">100%</output>
              </div>
              <input class="zoom-slider" type="range" name="markSize" aria-label="Dot size 1" min="0.25" max="4" step="0.05" value="1">
            </div>
            <div class="size-row" data-size="2">
              <div class="field">
                <span class="size-choice"><input type="checkbox" name="sizeOn2" aria-label="Export size 2"><label class="radio-option"><input type="radio" name="sizePreview" value="2"><span>Size 2</span></label></span>
                <output id="mark-size-2-level">75%</output>
              </div>
              <input class="zoom-slider" type="range" name="markSize2" aria-label="Dot size 2" min="0.25" max="4" step="0.05" value="0.75" data-show="sizeOn2=true">
            </div>
            <div class="size-row" data-size="3">
              <div class="field">
                <span class="size-choice"><input type="checkbox" name="sizeOn3" aria-label="Export size 3"><label class="radio-option"><input type="radio" name="sizePreview" value="3"><span>Size 3</span></label></span>
                <output id="mark-size-3-level">150%</output>
              </div>
              <input class="zoom-slider" type="range" name="markSize3" aria-label="Dot size 3" min="0.25" max="4" step="0.05" value="1.5" data-show="sizeOn3=true">
            </div>
          </fieldset>
        </fieldset>
      </aside>
      <!-- The composition: what is printed and where -->
      <aside id="panel-composition" class="card panel" aria-label="Composition">
        <fieldset class="panel-settings" disabled>
          <fieldset class="group"><legend>Format</legend>
            <div class="options inline">
              <label class="radio-option"><input type="radio" name="sheet" value="420x594" data-name="A2" checked><span>A2</span></label>
              <label class="radio-option"><input type="radio" name="sheet" value="297x420" data-name="A3"><span>A3</span></label>
            </div>
          </fieldset>
          <fieldset class="group"><legend class="legend-row">Zoom
              <span class="zoom-controls legend-value">
                <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
                <output id="zoom-level" aria-label="Map zoom">160%</output>
                <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
              </span>
            </legend>
            <input class="zoom-slider" type="range" name="zoom" aria-label="Map zoom" min="1" max="5" step="any" value="1.6">
          </fieldset>
          <fieldset class="group"><legend class="legend-row">Position <button type="button" id="reset-position" class="legend-action" title="Return to the original project center">Reset</button></legend>
            <div class="field"><span id="offset-x-label">Offset X</span><span><output name="offsetX" aria-labelledby="offset-x-label">0</output> mm</span></div>
            <div class="field"><span id="offset-y-label">Offset Y</span><span><output name="offsetY" aria-labelledby="offset-y-label">0</output> mm</span></div>
          </fieldset>
        </fieldset>
      </aside>
      <aside id="panel-colors" class="card panel" aria-label="Colors">
        <fieldset class="panel-settings" disabled>
          <fieldset class="group"><legend>Colors</legend>
            <div class="options">
              <label class="radio-option"><input type="radio" name="colorBy" value="image" checked><span>Image color</span></label>
              <label class="radio-option"><input type="radio" name="colorBy" value="tone"><span>Gray tone</span></label>
              <label class="radio-option"><input type="radio" name="colorBy" value="solid"><span>Solid black</span></label>
            </div>
          </fieldset>
        </fieldset>
      </aside>
    </div>
    <div class="column" id="column-right">
      <figure id="loupe" class="card panel" aria-label="Inspect">
        <div class="panel-title legend-row">Inspect <button type="button" id="inspect" class="legend-action" aria-pressed="false" aria-controls="preview" aria-describedby="inspect-help" title="Choose an area of the sheet to inspect (I)" disabled>Select area</button></div>
        <canvas width="600" height="600" role="img" aria-label="Selected area at export resolution"></canvas>
        <figcaption>Loading detail…</figcaption>
        <p id="inspect-help" class="inspect-hint" hidden>Move the square to inspect. Click to select an area. Escape cancels.</p>
      </figure>
      <!-- Preview controls, inks, separation and screening settings -->
      <aside id="panel-preview" class="card panel" aria-label="Preview">
        <fieldset class="panel-settings" disabled>
          <fieldset class="group"><legend class="legend-row">Inks <button type="button" id="reset-inks" class="legend-action" title="Reset ink colors to the palettes generated from the original image colors">Reset</button></legend>
            <div class="options">
              <div class="ink-option">
                <label class="radio-option"><input type="radio" name="inkMode" value="mono" checked><span>One color</span></label>
                <input type="color" name="monoInk" aria-label="One color ink" value="#1a1a1a" data-show="inkMode=mono">
              </div>
              <div class="ink-option">
                <label class="radio-option"><input type="radio" name="inkMode" value="spot2"><span>2 spot colors</span></label>
                <div class="swatches" data-show="inkMode=spot2">
                  <input type="color" aria-label="Two-color palette ink 1" name="spot2Ink1" value="#000000">
                  <input type="color" aria-label="Two-color palette ink 2" name="spot2Ink2" value="#000000">
                </div>
              </div>
              <div class="ink-option">
                <label class="radio-option"><input type="radio" name="inkMode" value="spot3"><span>3 spot colors</span></label>
                <div class="swatches" data-show="inkMode=spot3">
                  <input type="color" aria-label="Three-color palette ink 1" name="spot3Ink1" value="#000000">
                  <input type="color" aria-label="Three-color palette ink 2" name="spot3Ink2" value="#000000">
                  <input type="color" aria-label="Three-color palette ink 3" name="spot3Ink3" value="#000000">
                </div>
              </div>
            </div>
          </fieldset>
          <fieldset class="group" data-show="inkMode=spot2,spot3"><legend>Separation</legend>
            <div class="options">
              <label class="radio-option"><input type="radio" name="spotMethod" value="flat" checked><span>Flat (nearest ink)</span></label>
              <label class="radio-option"><input type="radio" name="spotMethod" value="dither"><span>Dithered</span></label>
            </div>
          </fieldset>
          <fieldset class="group"><legend>Paper</legend>
            <label class="field">Color <input type="color" name="paper" value="#f4f0e6"></label>
          </fieldset>
          <fieldset class="group" id="view"><legend>Films</legend>
            <div class="options"><label class="radio-option"><input type="radio" name="previewFilm" value="composite" checked><span>Composite</span></label></div>
          </fieldset>
          <fieldset class="group"><legend>Sheet</legend>
            <div class="options">
              <label class="check-option" title="Extend each film 10 mm past the sheet, with registration targets and crop marks"><input type="checkbox" name="bleed" data-overlay checked><span>Bleed 10 mm</span></label>
              <label class="check-option" title="Show center and thirds guides on the sheet (G). Guides never print."><input type="checkbox" name="grid" data-overlay><span>Grid</span></label>
              <label class="check-option" title="Show thin guides every 50 mm from the sheet center. Guides never print."><input type="checkbox" name="gridFine" data-overlay><span>Grid 50 mm</span></label>
            </div>
          </fieldset>
        </fieldset>
      </aside>
      <!-- Export: films at a fixed 300 dpi -->
      <footer id="panel-output" class="card panel" aria-label="Export">
        <button type="button" id="export" class="action-button action-primary" disabled title="One 300 dpi PNG film per ink, for each dot size">Export films</button>
        <ul id="file-names" class="file-names" aria-label="Files to export" hidden></ul>
        <p id="status" role="status">Loading collection…</p>
      </footer>
      <!-- Not a .panel: it must survive hiding the panels, or there is no way back. -->
      <button type="button" id="chrome-toggle" class="card" title="Hide or show panels (H)">Hide panels</button>
    </div>

  </form>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
